<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тайный Вагон • 24/7</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0f1115;
            color: #f5f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #181b22;
            border: 1px solid #272c38;
            border-radius: 20px;
            padding: 32px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }
        .badge {
            display: inline-block;
            background: rgba(245, 166, 35, 0.12);
            color: #f5a623;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(245, 166, 35, 0.25);
        }
        .icon {
            font-size: 40px;
            margin-bottom: 14px;
            display: block;
            line-height: 1;
            letter-spacing: 2px;
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 10px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }
        p {
            font-size: 14px;
            line-height: 1.5;
            color: #9299a9;
            margin-bottom: 28px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: #f5a623;
            color: #0f1115;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            padding: 16px 20px;
            border-radius: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(245, 166, 35, 0.35);
        }
        .btn:active {
            transform: scale(0.98);
            background: #e09318;
        }
        .route {
            margin-top: 24px;
            font-size: 11px;
            color: #555e70;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Ночной экспресс</div>
        <span class="icon">🚂🚃✨</span>
        <h1>«ТАЙНЫЙ ВАГОН»</h1>
        <p>15 минут в анонимном купе тет-а-тет под стук колёс или планы на вечер на Доске рейсов. Контакты открываются только при взаимном согласии.</p>
        
        <a href="https://t.me/Talk_Guard_Ai?start=express" class="btn" id="tgLink">
            <span>🎫 Занять место в купе</span>
        </a>

        <div class="route">Посадка открыта • 24/7</div>
    </div>

    <script>
        // Мягкий автопереход в Telegram через 2.5 секунды, если пользователь не нажал кнопку сразу
        setTimeout(function() {
            window.location.href = "https://t.me/Talk_Guard_Ai?start=express";
        }, 2500);
    </script>
</body>
</html>
